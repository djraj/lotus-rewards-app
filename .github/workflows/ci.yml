name: CI

on:
  pull_request:
  push:
    branches: [main]

# Newer pushes to the same PR / branch cancel in-flight runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `npm run build` runs `tsc --noEmit` first (prebuild), so this gates on
      # type errors too. The build does not need the Supabase env vars — they
      # only matter at runtime in the browser.
      - run: npm run build
