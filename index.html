
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Golden Lotus Healing Center (GLHC)</title>
    <meta name="description" content="Golden Lotus Healing Center (GLHC) - Pranic Healing sessions, seminars and workshops, plus GLHC Member Rewards for our community." />
    <meta name="theme-color" content="#000745" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="alternate icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f8fafc;
      }
      .font-serif {
        font-family: 'Playfair Display', serif;
      }

      /* Public-site motion. Kept here (not Tailwind config) because Tailwind
         runs from the CDN with no build step. Every loop is decorative and
         switched off under prefers-reduced-motion at the bottom. */
      @keyframes gl-fade-up { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
      @keyframes gl-fade-in { from { opacity: 0; } to { opacity: 1; } }
      @keyframes gl-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
      @keyframes gl-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
      @keyframes gl-sway { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
      @keyframes gl-ripple { from { transform: scale(0.6); opacity: 0.7; } to { transform: scale(1.6); opacity: 0; } }
      @keyframes gl-drift {
        0% { transform: translate3d(0, -10vh, 0) rotate(0deg); opacity: 0; }
        10% { opacity: 0.9; }
        90% { opacity: 0.9; }
        100% { transform: translate3d(var(--gl-drift-x, 40px), 110vh, 0) rotate(360deg); opacity: 0; }
      }
      @keyframes gl-shimmer { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
      @keyframes gl-grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
      @keyframes gl-dash { to { stroke-dashoffset: 0; } }

      .gl-reveal { opacity: 0; transform: translateY(24px); transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.22, 1, 0.36, 1); }
      .gl-reveal.is-visible { opacity: 1; transform: none; }
      .gl-fade-up { animation: gl-fade-up 0.9s cubic-bezier(0.22, 1, 0.36, 1) both; }
      .gl-page { animation: gl-fade-in 0.5s ease both; }
      .gl-float { animation: gl-float 6s ease-in-out infinite; }
      .gl-float-slow { animation: gl-float 9s ease-in-out infinite; }
      .gl-breathe { animation: gl-breathe 5s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      .gl-sway { animation: gl-sway 7s ease-in-out infinite; transform-origin: bottom center; transform-box: fill-box; }
      .gl-ripple { animation: gl-ripple 4s ease-out infinite; transform-origin: center; transform-box: fill-box; }
      .gl-petal { position: absolute; top: 0; animation: gl-drift linear infinite both; pointer-events: none; }
      .gl-grow { animation: gl-grow 1.2s cubic-bezier(0.22, 1, 0.36, 1) both; transform-origin: bottom; transform-box: fill-box; }
      .gl-dash { stroke-dasharray: 6 8; }
      .gl-shimmer-text {
        background: linear-gradient(90deg, #f43f5e, #f59e0b, #f43f5e);
        background-size: 200% auto;
        -webkit-background-clip: text; background-clip: text; color: transparent;
        animation: gl-shimmer 6s linear infinite;
      }
      .gl-lift { transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.35s ease; }
      .gl-lift:hover { transform: translateY(-6px); box-shadow: 0 20px 40px -20px rgba(244, 63, 94, 0.35); }

      @media (prefers-reduced-motion: reduce) {
        .gl-reveal { opacity: 1; transform: none; transition: none; }
        .gl-fade-up, .gl-page, .gl-float, .gl-float-slow, .gl-breathe, .gl-sway,
        .gl-ripple, .gl-grow, .gl-shimmer-text { animation: none; }
        .gl-petal { display: none; }
        .gl-lift, .gl-lift:hover { transition: none; transform: none; }
      }
    </style>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
