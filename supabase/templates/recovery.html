<!doctype html>
<html>
  <body style="margin:0;padding:0;background:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#0f172a;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f8fafc;padding:32px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border:1px solid #e2e8f0;border-radius:20px;padding:36px;">
            <tr>
              <td style="font-size:22px;font-weight:700;color:#1e293b;padding-bottom:8px;">
                🪷&nbsp;Golden Lotus
              </td>
            </tr>
            <tr>
              <td style="font-size:20px;font-weight:700;padding:12px 0 4px;">Reset your password</td>
            </tr>
            <tr>
              <td style="font-size:15px;line-height:1.6;color:#475569;padding-bottom:24px;">
                We received a request to reset the password for <strong>{{ .Email }}</strong>. Tap below to choose a new one. This link expires in about an hour.
              </td>
            </tr>
            <tr>
              <td style="padding-bottom:24px;">
                <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#f43f5e;color:#ffffff;text-decoration:none;font-weight:700;font-size:15px;padding:13px 28px;border-radius:14px;">Choose a new password</a>
              </td>
            </tr>
            <tr>
              <td style="font-size:13px;line-height:1.6;color:#94a3b8;">
                Didn't ask for this? Your password is unchanged — you can ignore this email.
              </td>
            </tr>
          </table>
          <div style="max-width:480px;font-size:12px;color:#cbd5e1;padding:16px 8px;">&copy; Golden Lotus Rewards</div>
        </td>
      </tr>
    </table>
  </body>
</html>
