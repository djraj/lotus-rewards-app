<!doctype html>
<html>
  <body style="margin:0;padding:0;background:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#0f172a;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f8fafc;padding:32px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border:1px solid #e2e8f0;border-radius:20px;padding:36px;">
            <tr>
              <td style="padding-bottom:16px;">
                <img src="{{ .SiteURL }}/logo-email.png" width="200" height="44" alt="GLHC Rewards — Golden Lotus Healing Center" style="display:block;border:0;outline:none;text-decoration:none;border-radius:10px;" />
              </td>
            </tr>
            <tr>
              <td style="font-size:20px;font-weight:700;padding:12px 0 4px;">Your sign-in link</td>
            </tr>
            <tr>
              <td style="font-size:15px;line-height:1.6;color:#475569;padding-bottom:24px;">
                Tap the button below to sign in to GLHC Rewards. This link is single-use and expires in about an hour.
              </td>
            </tr>
            <tr>
              <td style="padding-bottom:24px;">
                <a href="{{ .SiteURL }}/?token_hash={{ .TokenHash }}&amp;type=magiclink" style="display:inline-block;background:#f43f5e;color:#ffffff;text-decoration:none;font-weight:700;font-size:15px;padding:13px 28px;border-radius:14px;">Sign in to GLHC Rewards</a>
              </td>
            </tr>
            <tr>
              <td style="font-size:13px;line-height:1.6;color:#94a3b8;">
                Or enter this code: <span style="font-weight:700;color:#475569;letter-spacing:2px;">{{ .Token }}</span><br /><br />
                If you didn't request this, you can safely ignore this email.
              </td>
            </tr>
          </table>
          <div style="max-width:480px;font-size:12px;color:#cbd5e1;padding:16px 8px;">&copy; GLHC Rewards</div>
        </td>
      </tr>
    </table>
  </body>
</html>
